name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Checkout foc-local-first-android
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/foc-local-first-android
          path: foc-local-first-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ic-kotlin
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/ic-kotlin
          path: ic-kotlin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew foc-local-first-android/gradlew ic-kotlin/gradlew

      - name: Patch heap for CI (override 768m low-end host setting)
        run: echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> haven-mobile/mobile-app/gradle.properties && cat haven-mobile/mobile-app/gradle.properties

      - name: Create local.properties for CI (real config so startup succeeds)
        run: |
          cat > haven-mobile/mobile-app/local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          wallet.projectId=02760a75be7577c92e7d39f1de04db31
          haven.aol.canisterId=dciac-uaaaa-aaaad-qlzuq-cai
          haven.aol.icHost=https://ic0.app
          EOF
          cat haven-mobile/mobile-app/local.properties

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile

  startup-logcat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && needs.build.result != 'cancelled'
    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: /tmp/apk

      - name: Show APK info
        run: ls -lh /tmp/apk/*.apk && sha256sum /tmp/apk/*.apk || ls -R /tmp/apk

      - name: Run startup logcat on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r /tmp/apk/app-debug.apk || adb install -r /tmp/apk/*.apk
            adb logcat > /tmp/logcat.txt &
            LOGPID=$!
            echo "Starting MainActivity..."
            adb shell am start -n haven.mobile/haven.mobile.app.MainActivity || true
            sleep 12
            echo "=== adb devices ==="; adb devices || true
            echo "=== dumpsys package haven.mobile ==="; adb shell dumpsys package haven.mobile | head -n 80 || true
            echo "=== logcat (last 400 lines) ==="; adb logcat -d 2>&1 | tail -n 400 | head -n 400 || cat /tmp/logcat.txt | tail -n 400 || true
            echo "=== logcat FATAL ==="; adb logcat -d 2>&1 | grep -A 30 "FATAL EXCEPTION\|AndroidRuntime" | head -n 150 || echo "No FATAL found" || true
            kill $LOGPID || true
            echo "=== full logcat artifact ==="; ls -lh /tmp/logcat.txt 2>&1 | head -n 5; wc -l /tmp/logcat.txt 2>&1 | head -n 5 || true

      - name: Upload logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat
          path: /tmp/logcat.txt
          if-no-files-found: warn

  verify-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4

      - name: Download fresh target 34 APK (clean build artifact, not stale release)
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: /tmp/apk

      - name: Show fresh APK info
        run: |
          ls -lh /tmp/apk/*.apk
          sha256sum /tmp/apk/*.apk
          aapt dump badging /tmp/apk/*.apk | grep -E "package:|targetSdk|launchable" | head -n 5 || $ANDROID_SDK_ROOT/build-tools/36.0.0/aapt dump badging /tmp/apk/*.apk | grep -E "package:|targetSdk" | head -n 5
          # also fetch public release for comparison
          curl -L -o /tmp/release.apk https://github.com/Haven-hvn/haven-mobile/releases/download/v0.1.0-45fa35e/app-debug.apk 2>&1 | tail -1
          echo "--- public release ---"
          aapt dump badging /tmp/release.apk | grep -E "package:|targetSdk" | head -n 3 || true

      - name: Verify fresh APK headless (Launcher + Main alias, ANR dismiss, per-tab screencap, Choreographer)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim -memory 4096
          disable-animations: false
          script: |
            set -x
            echo "=== clean install fresh target 34 APK ==="
            adb logcat -c || true
            adb install -r /tmp/apk/app-debug.apk || adb install -r /tmp/apk/*.apk
            sleep 2
            echo "=== dismiss System UI ANR Wait if present (tap Wait ~160,520) ==="
            for i in 1 2 3; do adb shell input tap 150 400 2>&1 | head -n 2 || true; adb shell input tap 150 380 2>&1 | head -n 2 || true; sleep 1; done || true
            echo "=== launch LauncherActivity (haven.mobile.app.LauncherActivity) MAIN ==="
            adb shell am start -n haven.mobile/haven.mobile.app.LauncherActivity || adb shell am start -n haven.mobile/haven.mobile.app.LauncherActivity || true
            sleep 15
            # dismiss ANR again after launch
            adb shell input tap 150 400 2>&1 | head -n 2 || true
            sleep 2
            echo "=== dumpsys window after Launcher ==="
            adb shell dumpsys window | grep -i -E "mCurrentFocus|haven|Launcher" | head -n 30 || true
            echo "=== capture Launcher screenshot ==="
            adb exec-out screencap -p > /tmp/screen-launcher.png || true
            ls -lh /tmp/screen-launcher.png || true
            echo "=== probe alias haven.mobile/.MainActivity ==="
            adb shell am start -n haven.mobile/haven.mobile.app.MainActivity || true
            sleep 5
            adb shell input tap 150 400 2>&1 | head -n 2 || true
            sleep 1
            echo "=== drive bottom nav per tab with separate screencaps ==="
            mkdir -p /tmp/screens
            cp /tmp/screen-launcher.png /tmp/screens/00-launcher.png 2>&1 | head -n 2 || true
            # Tap each bottom-nav position and capture
            # Heuristic x positions for 4 tabs across 1080 width scaled to 320 emu: ~60,140,220,300 at y ~580
            for idx in 1 2 3 4; do if [ "$idx" = "1" ]; then x=60; name="Library"; elif [ "$idx" = "2" ]; then x=140; name="Feed"; elif [ "$idx" = "3" ]; then x=220; name="Communities"; else x=300; name="Settings"; fi; echo "--- tap $name ($x,580) idx $idx ---"; adb shell input tap $x 580 2>&1 | head -n 2 || true; sleep 3; adb shell input tap 150 400 2>&1 | head -n 2 || true; sleep 1; adb exec-out screencap -p > /tmp/screens/0${idx}-${name}.png || true; ls -lh /tmp/screens/0${idx}-${name}.png || true; adb shell dumpsys window | grep -i haven | head -n 5 || true; done
            echo "=== onboarding fallback check ==="
            adb shell dumpsys window | grep -i haven || true
            echo "=== logcat FATAL (haven) ==="
            adb logcat -d 2>&1 | grep -A 5 "FATAL EXCEPTION" | head -n 30 || echo "no FATAL"
            echo "=== ActivityTaskManager START (haven) ==="
            adb logcat -d 2>&1 | grep -E "ActivityTaskManager.*haven|LauncherActivity|MainActivity" | head -n 20 || true
            echo "=== Choreographer multi-frame responsiveness ==="
            adb logcat -d 2>&1 | grep Choreographer | head -n 20 || true
            adb logcat -d 2>&1 | grep -E "Choreographer|Skipped.*frames|vsync" | tail -n 20 || true
            echo "=== prepare combined screenshot dir ==="
            ls -lh /tmp/screens/ || true
            cp /tmp/screens/*.png /tmp/ 2>&1 | head -n 5 || true
            ls -lh /tmp/*.png 2>&1 | head -n 20 || true

      - name: Upload per-tab screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-release-screenshot
          path: |
            /tmp/screens/*.png
            /tmp/screen-launcher.png
          if-no-files-found: warn

  firebase-test-lab:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Download fresh APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: /tmp/apk

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project
        run: gcloud config set project test2026-e3159

      - name: Run Robo test on ARM (panther, API 34)
        run: |
          set -x
          ls -lh /tmp/apk/*.apk
          aapt dump badging /tmp/apk/*.apk | grep -E "package:|targetSdk" | head -n 3 || true
          gcloud firebase test android run \
            --type=robo \
            --app /tmp/apk/app-debug.apk \
            --device model=panther,version=34,locale=en,orientation=portrait \
            --timeout 10m \
            --results-dir haven-${{ github.run_id }} \
            || echo "Firebase Test Lab run finished with status $?"
          echo "View results: https://console.firebase.google.com/project/test2026-e3159/testlab/histories"

      - name: Show gcloud results
        if: always()
        run: gcloud firebase test android matrices list --limit 5 || true
