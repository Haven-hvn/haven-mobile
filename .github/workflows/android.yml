name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew

      - name: Patch heap for CI (override 768m low-end host setting)
        run: echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> haven-mobile/mobile-app/gradle.properties && cat haven-mobile/mobile-app/gradle.properties

      - name: Create local.properties for CI (real config so startup succeeds)
        run: |
          cat > haven-mobile/mobile-app/local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          wallet.projectId=02760a75be7577c92e7d39f1de04db31
          haven.aol.canisterId=3gzy3-kaaaa-aaaan-q6y6q-cai
          haven.aol.icHost=https://ic0.app
          arkiv.endpointUrl=https://rpc.rabdi.db-chain.testnet.arkiv.network
          arkiv.apiKey=${{ secrets.ARKIV_API_KEY }}
          EOF
          cat haven-mobile/mobile-app/local.properties

      - name: Install Android NDK (vetkeys native library)
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-mobile/mobile-app/core-haven-aol/src/main/rust/haven_vetkeys


      - name: Build vetkeys native libraries
        continue-on-error: true
        run: bash haven-mobile/mobile-app/tools/build-vetkeys-android.sh

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Order is documented in RELEASING.md: signed tag is pushed first, then the
      # release is created, so by the time this step runs the release exists.
      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile

      # The x86_64 APK for an emulator or a ChromeOS device. Same build, only the
      # packaged ABI differs. It runs last: enabling splits replaces, not adds,
      # the APK output, so every step above has already taken the universal APK.
      - name: Build the x86_64 APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug -Pabi=x86_64 --stacktrace

      - name: Upload the x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-x86_64
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

  startup-logcat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && needs.build.result != 'cancelled'
    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: /tmp/apk

      - name: Show APK info
        run: ls -lh /tmp/apk/*.apk && sha256sum /tmp/apk/*.apk || ls -R /tmp/apk

      - name: Run startup logcat on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          script: |
            echo "=== wait for boot completion (sys.boot_completed=1) ==="
            # Same gate as verify-release: with -accel off the runner can hand over adb
            # before the package manager exists ("Can't find service: package"). The
            # runner executes each script line as its own `sh -c`, so the poll and its
            # check must share a line.
            boot_ready=0; for i in $(seq 1 90); do if adb shell getprop sys.boot_completed 2>/dev/null | grep -q '1'; then echo "boot completed after $((i * 10))s"; boot_ready=1; break; fi; sleep 10; done; if [ "$boot_ready" != "1" ]; then echo "ERROR: boot did not complete after 900s"; adb shell getprop sys.boot_completed 2>&1 || true; exit 1; fi
            echo "=== settling 15s for package manager ==="
            sleep 15
            adb logcat -c
            for i in 1 2 3 4 5; do adb install -r /tmp/apk/app-debug.apk && break; echo "install attempt $i failed, retrying in 5s"; sleep 5; done
            adb logcat > /tmp/logcat.txt &
            LOGPID=$!
            echo "Starting MainActivity..."
            adb shell am start -n haven.mobile/haven.mobile.app.MainActivity || true
            sleep 12
            echo "=== adb devices ==="; adb devices || true
            echo "=== dumpsys package haven.mobile ==="; adb shell dumpsys package haven.mobile | head -n 80 || true
            echo "=== logcat (last 400 lines) ==="; adb logcat -d 2>&1 | tail -n 400 | head -n 400 || cat /tmp/logcat.txt | tail -n 400 || true
            echo "=== logcat FATAL ==="; adb logcat -d 2>&1 | grep -A 30 "FATAL EXCEPTION\|AndroidRuntime" | head -n 150 || echo "No FATAL found" || true
            kill $LOGPID || true
            echo "=== full logcat artifact ==="; ls -lh /tmp/logcat.txt 2>&1 | head -n 5; wc -l /tmp/logcat.txt 2>&1 | head -n 5 || true

      - name: Upload logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat
          path: /tmp/logcat.txt
          if-no-files-found: warn


