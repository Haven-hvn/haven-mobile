name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Checkout foc-local-first-android
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/foc-local-first-android
          path: foc-local-first-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ic-kotlin
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/ic-kotlin
          path: ic-kotlin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew foc-local-first-android/gradlew ic-kotlin/gradlew

      - name: Patch heap for CI (override 768m low-end host setting)
        run: echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> haven-mobile/mobile-app/gradle.properties && cat haven-mobile/mobile-app/gradle.properties

      - name: Create local.properties for CI (real config so startup succeeds)
        run: |
          cat > haven-mobile/mobile-app/local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          wallet.projectId=02760a75be7577c92e7d39f1de04db31
          haven.aol.canisterId=dciac-uaaaa-aaaad-qlzuq-cai
          haven.aol.icHost=https://ic0.app
          EOF
          cat haven-mobile/mobile-app/local.properties

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile

  startup-logcat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.build.result != 'cancelled'
    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: /tmp/apk

      - name: Show APK info
        run: ls -lh /tmp/apk/*.apk && sha256sum /tmp/apk/*.apk || ls -R /tmp/apk

      - name: Run startup logcat on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r /tmp/apk/app-debug.apk || adb install -r /tmp/apk/*.apk
            adb logcat > /tmp/logcat.txt &
            LOGPID=$!
            echo "Starting MainActivity..."
            adb shell am start -n haven.mobile/.MainActivity || true
            sleep 12
            echo "=== adb devices ==="; adb devices || true
            echo "=== dumpsys package haven.mobile ==="; adb shell dumpsys package haven.mobile | head -n 80 || true
            echo "=== logcat (last 400 lines) ==="; adb logcat -d 2>&1 | tail -n 400 | head -n 400 || cat /tmp/logcat.txt | tail -n 400 || true
            echo "=== logcat FATAL ==="; adb logcat -d 2>&1 | grep -A 30 "FATAL EXCEPTION\|AndroidRuntime" | head -n 150 || echo "No FATAL found" || true
            kill $LOGPID || true
            echo "=== full logcat artifact ==="; ls -lh /tmp/logcat.txt 2>&1 | head -n 5; wc -l /tmp/logcat.txt 2>&1 | head -n 5 || true

      - name: Upload logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat
          path: /tmp/logcat.txt
          if-no-files-found: warn
