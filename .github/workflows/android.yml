name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew

      - name: Patch heap for CI (override 768m low-end host setting)
        run: echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> haven-mobile/mobile-app/gradle.properties && cat haven-mobile/mobile-app/gradle.properties

      - name: Create local.properties for CI (real config so startup succeeds)
        run: |
          cat > haven-mobile/mobile-app/local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          wallet.projectId=02760a75be7577c92e7d39f1de04db31
          haven.aol.canisterId=3gzy3-kaaaa-aaaan-q6y6q-cai
          haven.aol.icHost=https://ic0.app
          arkiv.endpointUrl=https://rpc.rabdi.db-chain.testnet.arkiv.network
          arkiv.apiKey=${{ secrets.ARKIV_API_KEY }}
          EOF
          cat haven-mobile/mobile-app/local.properties

      - name: Install Android NDK (vetkeys native library)
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-mobile/mobile-app/core-haven-aol/src/main/rust/haven_vetkeys


      - name: Build vetkeys native libraries
        continue-on-error: true
        run: bash haven-mobile/mobile-app/tools/build-vetkeys-android.sh

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Order is documented in RELEASING.md: signed tag is pushed first, then the
      # release is created, so by the time this step runs the release exists.
      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile

      # The x86_64 APK for an emulator or a ChromeOS device. Same build, only the
      # packaged ABI differs. It runs last: enabling splits replaces, not adds,
      # the APK output, so every step above has already taken the universal APK.
      - name: Build the x86_64 APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug -Pabi=x86_64 --stacktrace

      - name: Upload the x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-x86_64
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
