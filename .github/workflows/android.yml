name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Checkout foc-local-first-android
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/foc-local-first-android
          path: foc-local-first-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ic-kotlin
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/ic-kotlin
          path: ic-kotlin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew foc-local-first-android/gradlew ic-kotlin/gradlew

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.jvmargs=-Xmx2g

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.jvmargs=-Xmx2g

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile
