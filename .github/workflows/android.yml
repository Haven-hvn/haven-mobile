name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout haven-mobile
        uses: actions/checkout@v4
        with:
          path: haven-mobile

      - name: Checkout foc-local-first-android
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/foc-local-first-android
          path: foc-local-first-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ic-kotlin
        uses: actions/checkout@v4
        with:
          repository: Haven-hvn/ic-kotlin
          path: ic-kotlin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x haven-mobile/mobile-app/gradlew foc-local-first-android/gradlew ic-kotlin/gradlew

      - name: Patch heap for CI (override 768m low-end host setting)
        run: echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> haven-mobile/mobile-app/gradle.properties && cat haven-mobile/mobile-app/gradle.properties

      - name: Create dummy local.properties for CI (avoid empty BuildConfig crash)
        run: |
          cat > haven-mobile/mobile-app/local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          wallet.projectId=dummy-ci-project-id-for-build-only
          haven.aol.canisterId=dummy-ci-canister
          haven.aol.icHost=https://ic0.app
          EOF
          cat haven-mobile/mobile-app/local.properties

      - name: Run unit tests
        working-directory: haven-mobile/mobile-app
        run: ./gradlew testDebugUnitTest --continue

      - name: Build debug APK
        working-directory: haven-mobile/mobile-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to existing release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" haven-mobile/mobile-app/app/build/outputs/apk/debug/app-debug.apk --clobber --repo Haven-hvn/haven-mobile
