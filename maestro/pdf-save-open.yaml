appId: haven.mobile
name: "FILE — save to device + open with (FR-FILE-1..4)"
tags: ["v1", "file"]
---
# The only path where decrypted content leaves the app, so the flow checks the guard rails rather
# than just the happy path: an explicit action, a one-time warning, and a hard block when the
# item's integrity check did not hold.
#
# Requires a fixture item of kind FILE in the connected wallet's library.

- launchApp
- tapOn: "Library"

# Filter to generic files. The chip is disabled when the count is zero, which is itself the signal
# that the fixture is missing.
- tapOn:
    text: "Files.*"
    optional: true
- tapOn:
    text: ".*"
    index: 0
    optional: true

# ── A gated fixture stops at the signature disclosure first ─────────────────────────────────
# Same disclosure as every other kind: the item, the guarantees, "Sign to open". Signing itself
# needs the wallet app, which Maestro cannot drive — asserted here, never tapped. Optional: an
# ungated (or already-unlocked) fixture goes straight to the viewer below.
- assertVisible:
    text: "Prove it's you to open this|Open this item"
    optional: true

# ── The FILE viewer explains itself before offering the action ────────────────────────────────
# Optional since the disclosure above: with a gated fixture this screen only appears after a
# real wallet signature, which this flow cannot perform.
- assertVisible:
    text: "Haven can't display this type inline.*"
    optional: true
- assertVisible:
    text: "Save to device|Unlock and save"
    optional: true

# "Open with…" is disabled until something has actually been saved — offering it earlier would
# hand the chooser a URI that does not exist.
- assertVisible: "Open with…"

# ── One-time warning (FR-FILE-3) ─────────────────────────────────────────────────────────────
- tapOn:
    text: "Save to device|Unlock and save"
- assertVisible: "Save this file?"
- assertVisible:
    text: ".*readable by any app on this phone.*"
# Cancelling must not save.
- tapOn: "Cancel"

# Second attempt, accepted. The system SAF picker follows; Maestro cannot drive it, so the run
# either completes the save or stops at the picker.
- tapOn:
    text: "Save to device|Unlock and save"
- tapOn:
    text: "Save anyway"
    optional: true
- assertVisible:
    text: "Saving…|Saved to device|Save failed"
    optional: true

# ── FR-FILE-4: a failed check blocks export outright ──────────────────────────────────────────
# Present only for an item whose content check did not hold; optional so the flow passes with a
# healthy fixture.
- assertVisible:
    text: "Export is blocked.*FR-FILE-4.*"
    optional: true
